# ==================== APPLICATION INFO ====================
spring.application.name=Starlink Manager
app.version=1.0.0
app.description=Sistema de Gestión de Equipos Starlink

# ==================== SERVER CONFIGURATION ====================
server.port=8081
server.servlet.context-path=/
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Error handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ==================== MYSQL DATABASE ====================
spring.datasource.url=jdbc:mysql://localhost:3306/starlink_manager?useSSL=false&serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=StarlinkHikariPool
spring.datasource.hikari.auto-commit=true

# ==================== JPA / HIBERNATE ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
spring.jpa.open-in-view=false

# ==================== FLYWAY (MIGRACIONES) ====================
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# ==================== SECURITY & JWT ====================
# JWT Configuration
jwt.secret=c3RhcmxpbmstbWFuYWdlci1zdXBlci1zZWNyZXQta2V5LTI1Ni1iaXRzLWJhc2U2NC1lbmNvZGVk
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Security
spring.security.user.name=admin
spring.security.user.password=admin123

# ==================== EMAIL CONFIGURATION ====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:tu-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:tu-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email settings
app.mail.from=noreply@starlinkmanager.com
app.mail.from-name=Starlink Manager

# ==================== CACHE CONFIGURATION ====================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=5m
spring.cache.cache-names=estadisticas,equipos,pagos,categorias

# ==================== JACKSON JSON ====================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=America/Mexico_City
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.default-property-inclusion=non_null

# ==================== MULTIPART / FILE UPLOAD ====================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# File storage
app.upload.dir=uploads
app.upload.max-size=10485760

# ==================== ACTUATOR (MONITOREO) ====================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.metrics.export.prometheus.enabled=true
management.info.env.enabled=true

# Health check
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.ping.enabled=true

# Info endpoint
info.app.name=@project.name@
info.app.description=@project.description@
info.app.version=@project.version@
info.app.encoding=@project.build.sourceEncoding@
info.app.java.version=@java.version@

# ==================== LOGGING ====================
logging.level.root=INFO
logging.level.com.starlink=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Log file
logging.file.name=logs/starlink-manager.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.file.total-size-cap=100MB

# ==================== SPRINGDOC / SWAGGER ====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true

# API Documentation
springdoc.api-docs.groups.enabled=true
springdoc.group-configs[0].group=public-api
springdoc.group-configs[0].paths-to-match=/api/**

# ==================== STARLINK CONFIGURATION ====================
starlink.local.ip=192.168.100.1
starlink.local.port=9200
starlink.sync.interval=30000
starlink.connection.timeout=5000
starlink.read.timeout=10000

# ==================== TWILIO (WHATSAPP/SMS) ====================
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:your_auth_token}
app.twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
app.twilio.phone-from=${TWILIO_PHONE_FROM:+15017122661}
app.twilio.enabled=false

# ==================== SCHEDULER (TAREAS PROGRAMADAS) ====================
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=scheduled-task-

# Scheduled tasks
app.scheduler.backup.enabled=true
app.scheduler.backup.cron=0 0 2 * * *
app.scheduler.notifications.enabled=true
app.scheduler.notifications.cron=0 0 9 * * *
app.scheduler.cleanup.enabled=true
app.scheduler.cleanup.cron=0 0 3 * * 0

# ==================== CORS CONFIGURATION ====================
app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=*
app.cors.allow-credentials=false
app.cors.max-age=3600

# ==================== PAGINATION ====================
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# ==================== TIMEZONE ====================
spring.jackson.time-zone=America/Mexico_City
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City

# ==================== CUSTOM APPLICATION PROPERTIES ====================
# Business rules
app.business.dias-aviso-vencimiento=3
app.business.dias-vencimiento-critico=7
app.business.monto-minimo-pago=1.00
app.business.monto-maximo-pago=999999.99

# Notifications
app.notifications.email.enabled=true
app.notifications.whatsapp.enabled=false
app.notifications.sms.enabled=false

# Reports
app.reports.temp-dir=temp/reports
app.reports.max-records-excel=10000
app.reports.max-records-pdf=1000

# Backup
app.backup.enabled=true
app.backup.directory=backups
app.backup.retention-days=90
app.backup.compress=true

# ==================== DEVELOPMENT / PRODUCTION PROFILES ====================
# Active profile (dev, test, prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==================== BANNER ====================
spring.banner.location=classpath:banner.txt
spring.main.banner-mode=console

# ==================== INTERNATIONALIZATION ====================
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=true

# ==================== THYMELEAF (si usas templates) ====================
spring.thymeleaf.enabled=false
spring.thymeleaf.cache=false

# ==================== DEVTOOLS (DESARROLLO) ====================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.add-properties=true

# ==================== TRANSACTION ====================
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false
spring.transaction.default-timeout=30

# ==================== HTTP ENCODING ====================
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# ==================== CUSTOM ERROR PAGES ====================
server.error.whitelabel.enabled=false
